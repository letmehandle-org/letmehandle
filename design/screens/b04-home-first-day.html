<!--
title: Home — day one
group: Home
tab: home
note: A designed empty state, not a blank screen. The ring is drawn unfilled so its job is obvious before any data exists.
-->
<div class="bar"><span class="pill-status"><span class="dot beat"></span><span class="t">On duty</span></span></div>
<div class="hero">
  <div class="dial blank" style="--dial-size:158px;border-color:rgba(255,255,255,.8)">
    <div class="core"><b style="color:var(--d-hero-mut)">0</b><span class="u">Calls today</span></div>
  </div>
</div>
<div class="pad center" style="margin-top:18px">
  <p class="sm" style="font-size:12.5px;color:var(--d-fg)">Nothing has come in yet.</p>
</div>
<div class="list" style="margin-top:14px">
  <p class="lbl">When it does</p>
  <div class="card">
    <div class="row"><span class="disc ok"><svg class="ic-sm ic"><use href="#i-check"/></svg></span>
      <div class="tx"><b>Settled ones fill this ring</b></div></div>
    <div class="row"><span class="disc warn"><svg class="ic-sm ic"><use href="#i-phone-in"/></svg></span>
      <div class="tx"><b>You're rung only if needed</b></div></div>
  </div>
</div>
