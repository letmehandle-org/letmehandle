<!--
title: Welcome
group: Getting started
class: s-welcome
note: A landing page in one screen. A phone in the middle is quietly being looked after — a delivery settled, spam turned away, one call that needs you — so the promise is seen before a word is read. Three features as picture tiles underneath.
-->
<div class="stage">
  <span class="blob b1"></span><span class="blob b2"></span>
  <svg class="spark s1 ic"><use href="#i-sparkle"/></svg>
  <svg class="spark s2 ic"><use href="#i-sparkle"/></svg>

  <div class="ph">
    <span class="notch"></span>
    <div class="dial" style="--dial-size:74px;--seg-a:62%;--seg-b:70%;--seg-c:54%;--d-dial-rest:#ECE8FA;margin-top:22px">
      <div class="track"></div><div class="inner"></div>
      <div class="core"><b style="font-size:18px">39</b></div>
    </div>
    <div class="mini">
      <i><u class="ok"></u><em style="width:46px"></em></i>
      <i><u class="wr"></u><em style="width:36px"></em></i>
      <i><u></u><em style="width:52px"></em></i>
    </div>
  </div>

  <div class="chip c1"><span class="disc ok"><svg class="ic"><use href="#i-truck"/></svg></span>Delivery<svg class="ic tick"><use href="#i-check"/></svg></div>
  <div class="chip c2"><span class="disc warn"><svg class="ic"><use href="#i-phone-ring"/></svg></span>Needs you</div>
  <div class="chip c3"><span class="disc"><svg class="ic"><use href="#i-ban"/></svg></span>Spam</div>
</div>

<div class="pad center" style="margin-top:6px">
  <h1 class="h1" style="font-size:22px">Your phone,<br><span style="color:var(--d-acc)">handled.</span></h1>
</div>

<div class="feats">
  <div><span class="disc ok"><svg class="ic"><use href="#i-bot"/></svg></span>Answers<br>your calls</div>
  <div><span class="disc warn"><svg class="ic"><use href="#i-phone-ring"/></svg></span>Rings you<br>if needed</div>
  <div><span class="disc"><svg class="ic"><use href="#i-lock"/></svg></span>Never<br>records</div>
</div>

<div class="foot"><button class="btn primary">Get started</button></div>
