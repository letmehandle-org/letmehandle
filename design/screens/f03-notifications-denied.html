<!--
title: Notifications are off
group: When things go wrong
tab: home
note: The product still works without permission, and the screen says precisely what is lost rather than nagging.
-->
<div class="bar"><span class="pill-status"><span class="dot beat"></span><span class="t">On duty</span></span></div>
<div class="banner off" style="margin-top:12px;align-items:flex-start">
  <svg class="ic-sm ic" style="margin-top:2px"><use href="#i-bell-off"/></svg>
  <span style="flex:1">Your phone will still ring when you're needed &mdash; you just won't see why first.
    <b style="display:block;color:var(--d-acc-deep);font-weight:600;margin-top:5px">Turn notifications on</b></span>
</div>
<div class="hero" style="margin-top:10px;padding:12px 0 14px">
  <div class="dial" style="--dial-size:136px;--seg-a:62%;--seg-b:70%;--seg-c:54%">
    <div class="track"></div><div class="inner"></div>
    <div class="core"><b>39</b><span class="u">Calls today</span><span class="k">You took 3</span></div>
  </div>
</div>
<div class="list" style="padding-top:12px">
  <p class="lbl">Latest</p>
  <div class="card">
    <div class="row tap"><span class="disc ok"><svg class="ic-sm ic"><use href="#i-truck"/></svg></span>
      <div class="tx"><b>Courier</b><s>Gate by 6 pm</s></div><span class="end num">10:24</span></div>
    <div class="row tap"><span class="disc warn"><svg class="ic-sm ic"><use href="#i-card"/></svg></span>
      <div class="tx"><b>Your bank</b><s>You joined</s></div><span class="end num">09:12</span></div>
  </div>
</div>
