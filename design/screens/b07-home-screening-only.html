<!--
title: Home — screening phone
group: Home
tab: home
note: The same app on a transport that cannot stream audio or bridge a human. No conversation, no escalation, and no control that pretends otherwise — the unsupported features are absent, not disabled.
-->
<div class="bar"><span class="pill-status"><span class="dot beat"></span><span class="t">Screening</span></span></div>
<div class="hero">
  <div class="dial" style="--dial-size:138px;--seg-a:0%;--seg-b:74%;--seg-c:0%">
    <div class="track" style="background:conic-gradient(var(--d-dial-rest) 0 74%,var(--d-arc) 74% 100%)"></div>
    <div class="core"><b>12</b><span class="u">Stopped today</span><span class="k">27 rang you</span></div>
  </div>
  <div class="legend">
    <span><i style="background:var(--d-arc)"></i>27 through</span>
    <span><i style="background:rgba(255,255,255,.9)"></i>12 stopped</span>
  </div>
</div>
<div class="pad" style="margin-top:14px">
  <div class="panel" style="display:flex;gap:11px;align-items:flex-start">
    <svg class="ic-sm ic" style="color:var(--d-dim);margin-top:1px"><use href="#i-info"/></svg>
    <p class="sm" style="font-size:11px;line-height:1.55">This phone can stop a call before it rings. It can't let your assistant talk to a caller.</p>
  </div>
</div>
<div class="list" style="margin-top:10px">
  <p class="lbl">Latest</p>
  <div class="card">
    <div class="row tap"><span class="disc stop"><svg class="ic-sm ic"><use href="#i-ban"/></svg></span>
      <div class="tx"><b>Spam likely</b><s>Stopped</s></div><span class="end num">10:31</span></div>
    <div class="row tap"><span class="disc acc"><svg class="ic-sm ic"><use href="#i-user"/></svg></span>
      <div class="tx"><b>Mum</b><s>Rang you</s></div><span class="end num">09:55</span></div>
  </div>
</div>
