<!--
title: Home — it needs you
group: Home
tab: home
badge: activity
note: The live escalation indicator phase 10 requires. The hero warms to apricot — the one colour that only ever means you are wanted — and the phone is already ringing.
-->
<div class="bar"><span class="dot warn beat"></span>
  <span class="t" style="color:var(--d-warn-deep)">Needs you</span>
  <span class="r num" style="color:var(--d-warn-deep)">1:28</span></div>
<div class="hero" style="--d-hero-a:#FFEBD8;--d-hero-b:#FFDCBC;--d-hero-ink:#5C3208;--d-hero-mut:#A9743E;--d-arc:#F08A3C">
  <div class="dial live" style="--dial-size:158px;--seg-a:0%;--seg-b:18%;--seg-c:0%">
    <div class="track"></div>
    <div class="core">
      <svg class="ic" style="width:30px;height:30px;color:#8A4A0E"><use href="#i-phone-ring"/></svg>
      <span class="u" style="margin-top:8px;color:#8A4A0E">Answer your phone</span>
    </div>
  </div>
</div>
<div class="list">
  <div class="card" style="padding:11px 13px">
    <div style="display:flex;align-items:center;gap:11px">
      <span class="disc warn"><svg class="ic-sm ic"><use href="#i-card"/></svg></span>
      <div class="tx" style="flex:1"><b style="font-size:13px">Your bank</b>
        <s style="font-size:10.5px;color:var(--d-warn-deep)">Can't agree without you</s></div>
    </div>
    <p class="sm" style="margin-top:10px;color:var(--d-fg);font-size:11.5px">
      &#8377;42,000 held from a payment in Pune at 08:58.</p>
  </div>
</div>
<div class="foot">
  <button class="btn ghost"><svg class="ic-sm ic"><use href="#i-arrow-r"/></svg>See the whole picture</button>
</div>
