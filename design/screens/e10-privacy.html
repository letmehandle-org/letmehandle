title: Privacy
group: Settings
tab: settings
note: Retention is a control, not a policy page (D-014). What is never kept is stated as plainly as what is. Account deletion is the phase 12 route and removes everything.
-->
<div class="bar nav"><button class="back"><svg class="ic"><use href="#i-chev-l"/></svg></button><span class="t">Privacy</span></div>
<div class="pad" style="margin-top:16px">
  <p class="lbl" style="margin-bottom:8px">Keep what was said for</p>
  <div class="pick"><span>1 day</span><span class="on">7 days</span><span>30 days</span><span>Never</span></div>
  <p class="sm" style="margin-top:10px;font-size:10.5px;color:var(--d-faint);line-height:1.55">
    Summaries always stay. Only the words go.</p>
</div>
<div class="list" style="padding-top:16px">
  <p class="lbl">Never kept</p>
  <div class="card">
    <div class="row"><svg class="ic" style="color:var(--d-acc-deep)"><use href="#i-mic"/></svg>
      <div class="tx"><b>Call recordings</b></div>
      <span class="end"><svg class="ic-sm ic" style="color:var(--d-acc-deep)"><use href="#i-check"/></svg></span></div>
  </div>
  <div class="card" style="margin-top:12px">
    <div class="row tap"><svg class="ic" style="color:var(--d-stop)"><use href="#i-trash"/></svg>
      <div class="tx"><b style="color:var(--d-stop)">Delete account</b></div>
      <span class="end chev"><svg class="ic-sm ic"><use href="#i-chev-r"/></svg></span></div>
  </div>
