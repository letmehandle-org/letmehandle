<div class="bar">
  <svg class="ic" style="color:var(--d-dim)"><use href="#i-clock"/></svg>
  <span class="t">Can wait</span>
  <span class="r"><svg class="ic"><use href="#i-x"/></svg></span>
</div>
<div class="hero" style="padding:12px 0 14px">
  <div class="dial blank" style="--dial-size:112px;border-color:rgba(255,255,255,.8)">
    <div class="core">
      <span class="disc acc" style="width:40px;height:40px;flex-basis:40px;background:rgba(255,255,255,.8)">
        <svg class="ic"><use href="#i-school"/></svg></span>
    </div>
  </div>
  <p class="center" style="margin:10px 0 0;font-size:15px;font-weight:400;letter-spacing:-.015em">School office</p>
  <p class="center" style="margin:3px 0 0;font-size:10.5px;color:var(--d-hero-mut)">11:02 &middot; 2 min &middot; ended</p>
</div>
<div class="list" style="padding-top:12px">
  <div class="card">
    <div class="row"><span class="disc"><svg class="ic-sm ic"><use href="#i-cal"/></svg></span>
      <div class="tx"><b>A parent slot on Thursday, 4 or 5 pm</b><s>What they want</s></div></div>

      <div class="tx"><b>You haven't let it book appointments</b><s>Why it asked you</s></div></div>
    <div class="row"><span class="disc ok"><svg class="ic-sm ic"><use href="#i-msg"/></svg></span>
      <div class="tx"><b>It took a message and said you'd reply</b><s>What it did</s></div></div>
  </div>
</div>
