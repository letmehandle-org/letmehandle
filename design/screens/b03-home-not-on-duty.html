<!--
title: Home — not on duty
group: Home
tab: home
note: Inactive, and why. There is no on/off switch in the product — the assistant is inactive only when the device or the transport stops handing it calls, so the screen names the cause and the fix.
-->
<div class="bar"><span class="pill-status"><span class="dot off"></span><span class="t" style="color:var(--d-dim)">Not on duty</span></span></div>
<div class="hero" style="--d-hero-a:#F2F0F8;--d-hero-b:#E8E5F2;--d-hero-ink:#4A4560;--d-hero-mut:#8A83A8">
  <div class="dial blank" style="--dial-size:146px">
    <div class="core">
      <svg class="ic" style="width:28px;height:28px;color:var(--d-ghost)"><use href="#i-phone-off"/></svg>
      <span class="u" style="margin-top:10px">Calls ring you directly</span>
    </div>
  </div>
</div>
<div class="pad" style="margin-top:14px">
  <div class="panel" style="display:flex;gap:11px;align-items:flex-start">
    <svg class="ic-sm ic" style="color:var(--d-warn-deep);margin-top:2px"><use href="#i-alert"/></svg>
    <p class="sm" style="font-size:11.5px;color:var(--d-fg)">This phone stopped handing calls to LetMeHandle.</p>
  </div>
</div>
<div class="list" style="margin-top:10px">
  <p class="lbl">Earlier today</p>
  <div class="card" style="opacity:.65">
    <div class="row"><span class="disc ok"><svg class="ic-sm ic"><use href="#i-truck"/></svg></span>
      <div class="tx"><b>Courier</b><s>Gate by 6 pm</s></div><span class="end num">10:24</span></div>
  </div>
</div>
<div class="foot"><button class="btn primary">Open phone settings</button></div>
