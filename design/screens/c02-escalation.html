<!--
title: It needs you — now
group: When it needs you
note: Read top to bottom: how long, who, why it stopped, what it has, what it wants. No control that would imply the app runs the call.
-->
<div class="bar">
  <svg class="ic" style="color:var(--d-warn-deep)"><use href="#i-phone-ring"/></svg>
  <span class="t" style="color:var(--d-warn-deep)">Needs you</span>
  <span class="r num" style="color:var(--d-warn-deep)">1:28</span>
</div>
<div class="hero" style="--d-hero-a:#FFEBD8;--d-hero-b:#FFDCBC;--d-hero-ink:#5C3208;--d-hero-mut:#A9743E;--d-arc:#F08A3C;padding:12px 0 14px">
  <div class="dial live" style="--dial-size:112px;--seg-a:0%;--seg-b:18%;--seg-c:0%">
    <div class="track"></div>
    <div class="core">
      <span class="disc warn" style="width:40px;height:40px;flex-basis:40px;background:rgba(255,255,255,.75)">
        <svg class="ic"><use href="#i-card"/></svg></span>
    </div>
  </div>
  <p class="center" style="margin:10px 0 0;font-size:15px;font-weight:400;letter-spacing:-.015em">Your bank</p>
  <p class="center" style="margin:3px 0 0;font-size:10.5px;color:var(--d-hero-mut)">Important contact</p>
</div>
<div class="list" style="padding-top:12px">
  <div class="card">
    <div class="row"><span class="disc warn"><svg class="ic-sm ic"><use href="#i-lock"/></svg></span>
      <div class="tx"><b>You haven't let it confirm payments</b><s>Why it stopped</s></div></div>
    <div class="row"><span class="disc"><svg class="ic-sm ic"><use href="#i-info"/></svg></span>
      <div class="tx"><b>&#8377;42,000 attempted in Pune, 08:58</b><s>What it knows</s></div></div>
    <div class="row"><span class="disc"><svg class="ic-sm ic"><use href="#i-bubble-q"/></svg></span>
      <div class="tx"><b>Was it you? Yes or no</b><s>What it needs</s></div></div>
  </div>
</div>
<div class="foot" style="padding-top:4px">
  <div class="panel acc center" style="display:flex;align-items:center;justify-content:center;gap:9px;padding:12px">
    <svg class="ic-sm ic" style="color:var(--d-acc-deep)"><use href="#i-phone-in"/></svg>
    <span style="font-size:12px;color:var(--d-acc-deep)">Answer your phone to join</span>
  </div>
</div>
