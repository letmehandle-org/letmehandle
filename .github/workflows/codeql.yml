name: CodeQL

# Runs for a release, on demand, and from release.yml; pull requests are covered by ci.yml.
on:
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    name: Analyse ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
