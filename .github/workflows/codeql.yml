name: CodeQL

# Run when a release is published, as part of building it, and on demand. Pull requests and
# pushes to main are covered by the checks in ci.yml.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    name: Analyse ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
