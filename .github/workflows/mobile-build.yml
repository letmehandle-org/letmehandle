name: Mobile build

# Builds and tests the native applications only when the mobile app or its toolchain changes.
on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/actions/pnpm-install/**'
      - '.github/workflows/mobile-build.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/actions/pnpm-install/**'
      - '.github/workflows/mobile-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ios:
    name: iOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/pnpm-install

      # Ruby 3.4, because the bundler that wrote Gemfile.lock needs a Ruby newer than 3.3.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: apps/mobile

      - uses: actions/cache@v6
        with:
          path: apps/mobile/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('apps/mobile/ios/Podfile.lock', 'pnpm-lock.yaml') }}

      - name: Pods
        working-directory: apps/mobile/ios
        run: bundle exec pod install

      - name: Build
        working-directory: apps/mobile/ios
        run: |
          xcodebuild \
            -workspace LetMeHandle.xcworkspace \
            -scheme LetMeHandle \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/pnpm-install

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        working-directory: apps/mobile/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
