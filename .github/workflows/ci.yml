name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push cancels a branch's run; main keeps every run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  audit:
    name: Disclosure and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, for the history and range audits.
          fetch-depth: 0

      - name: Nothing private reached a tracked file
        run: python3 scripts/disclosure_audit.py

      - name: No file gained a multi-line docstring or comment block
        run: python3 scripts/comment_audit.py

      - name: Every link between the documents resolves
        run: python3 scripts/check_doc_links.py

      - name: Nothing private is anywhere in the history
        run: python3 scripts/disclosure_audit.py --history

      - name: Nothing private is in the commits being proposed
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/disclosure_audit.py \
            --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: The pull request's own title and body
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n%s\n' "$TITLE" "$BODY" \
            | python3 scripts/disclosure_audit.py --text --label "the pull request"

      # The gitleaks binary, since the action needs a licence for organisations.
      - name: Secrets, across the whole history
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose
          rm -f gitleaks gitleaks.tar.gz

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/backend

    # A real PostgreSQL; the database fixtures fail rather than skip when CI is set.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: letmehandle
          POSTGRES_PASSWORD: letmehandle
          POSTGRES_DB: letmehandle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U letmehandle -d letmehandle_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://letmehandle:letmehandle@localhost:5432/letmehandle_test
      DATABASE_URL: postgresql+asyncpg://letmehandle:letmehandle@localhost:5432/letmehandle_test

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras --frozen

      - name: Lint and format
        run: make -C ../.. lint-backend

      - name: Types and architecture boundaries
        run: make -C ../.. typecheck-backend

      - name: Migrations run forwards and backwards
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: The models and the migrations agree
        run: uv run alembic check

      - name: Tests and coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=98

      - name: The generated API types match the backend
        run: |
          uv run python ../../scripts/generate_openapi.py
          git diff --exit-code -- ../../packages/api-client/openapi.json

      - name: The configuration reference, .env.example and the compose file match the settings
        run: uv run python ../../scripts/generate_config_reference.py --check

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: apps/backend/coverage.xml
          if-no-files-found: ignore

  dependencies:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Its own job, because it reads advisory databases over the network.
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: ./.github/actions/pnpm-install

      - name: The backend's lock and the workspace's, against their advisory databases
        run: make audit-deps

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/pnpm-install

      - name: Lint
        run: pnpm --filter mobile lint

      - name: Types
        run: pnpm --filter mobile typecheck

      - name: Tests and coverage
        run: pnpm --filter mobile test:coverage

      - name: The generated API types type-check
        run: pnpm --filter @letmehandle/api-client typecheck

  image:
    name: Backend image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
