name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to a branch makes the first run's answer irrelevant. Cancelling it keeps the
# queue short and the feedback quick; main is exempt, because there every commit's result is a
# fact somebody may need later.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  audit:
    name: Disclosure and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The audit reads the commits in the pull request, not only the tree, so it needs the
          # history those commits live in.
          fetch-depth: 0

      - name: Nothing private reached a tracked file
        run: python3 scripts/disclosure_audit.py

      - name: Nothing private is anywhere in the history
        # The half a working-tree scan cannot see. A file removed from the tree and called done
        # stays in the commit that added it, which on a public repository is already published.
        run: python3 scripts/disclosure_audit.py --history

      - name: Nothing private is in the commits being proposed
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/disclosure_audit.py \
            --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: The pull request's own title and body
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n%s\n' "$TITLE" "$BODY" \
            | python3 scripts/disclosure_audit.py --text --label "the pull request"

      # The binary, not gitleaks/gitleaks-action. The scanner is open source; the action
      # requires a paid licence when the repository belongs to an organisation, and would
      # otherwise fail this job for a reason that has nothing to do with the code.
      - name: Secrets, across the whole history
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose
          rm -f gitleaks gitleaks.tar.gz

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    # A real PostgreSQL, because the tests that matter here rely on behaviour a substitute does
    # not have: unique constraints, cascading deletes, the row count a bulk update reports, and
    # timestamps that keep their timezone. The fixture skips when no database is reachable —
    # except when CI is set, where it fails instead, so this service cannot quietly disappear.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: letmehandle
          POSTGRES_PASSWORD: letmehandle
          POSTGRES_DB: letmehandle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U letmehandle -d letmehandle_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://letmehandle:letmehandle@localhost:5432/letmehandle_test
      DATABASE_URL: postgresql+asyncpg://letmehandle:letmehandle@localhost:5432/letmehandle_test

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy src tests

      - name: Architecture boundaries
        run: uv run lint-imports

      - name: Migrations run forwards and backwards
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: The models and the migrations agree
        # A migration written by hand against models that have moved on is a migration that
        # passes and leaves the database wrong.
        run: uv run alembic check

      - name: Tests and coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=98

      - name: The generated API types match the backend
        # A backend change that alters the wire format must change the generated types with it,
        # or the mobile app is compiling against a contract the backend no longer has.
        run: |
          uv run python ../../scripts/generate_openapi.py
          git diff --exit-code -- ../../packages/api-client/openapi.json

      - name: The configuration reference, .env.example and the compose file match the settings
        run: uv run python ../../scripts/generate_config_reference.py --check

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: apps/backend/coverage.xml
          if-no-files-found: ignore

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter mobile lint

      - name: Types
        run: pnpm --filter mobile typecheck

      - name: Tests and coverage
        run: pnpm --filter mobile test:coverage

      - name: The generated API types type-check
        run: pnpm --filter @letmehandle/api-client typecheck

  image:
    name: Backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
