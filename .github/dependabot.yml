version: 2
updates:
  - package-ecosystem: uv
    directory: /apps/backend
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    commit-message: {prefix: "build(backend)"}
    groups:
      # One pull request for the routine updates. Twenty separate ones is not twenty times the
      # safety, it is twenty times the review, and the reviewer stops reading.
      backend-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    commit-message: {prefix: "build(mobile)"}
    groups:
      react-native:
        patterns: ["react-native*", "@react-native*", "react", "react-dom", "react-test-renderer"]
      mobile-minor:
        update-types: [minor, patch]
        exclude-patterns: ["react-native*", "@react-native*", "react"]

  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    commit-message: {prefix: "ci"}
    groups:
      actions:
        update-types: [major, minor, patch]

  - package-ecosystem: docker
    directory: /infra/docker
    schedule: {interval: weekly}
    commit-message: {prefix: "build(docker)"}
    ignore:
      # The base image's Python version is decided by the project, not by what is newest: it is
      # pinned in .python-version and in pyproject.toml's requires-python, and a bump here
      # without those is a build failure by construction. Patch updates to the same minor are
      # still wanted, because those are the security fixes.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
