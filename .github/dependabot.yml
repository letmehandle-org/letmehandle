version: 2
updates:
  - package-ecosystem: uv
    directory: /apps/backend
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    commit-message: {prefix: "build(backend)"}
    groups:
      # One pull request for all routine backend updates.
      backend-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    commit-message: {prefix: "build(mobile)"}
    ignore:
      # Majors of Babel and React arrive with the React Native upgrade that pins them.
      - dependency-name: "@babel/*"
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-test-renderer
        update-types: [version-update:semver-major]
    groups:
      react-native:
        patterns: ["react-native*", "@react-native*", "react", "react-dom", "react-test-renderer"]
      mobile-minor:
        update-types: [minor, patch]
        exclude-patterns: ["react-native*", "@react-native*", "react"]

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    commit-message: {prefix: "ci"}
    groups:
      actions:
        update-types: [major, minor, patch]

  - package-ecosystem: docker
    directory: /infra/docker
    schedule: {interval: weekly}
    commit-message: {prefix: "build(docker)"}
    ignore:
      # Python's minor follows .python-version and requires-python; patch updates still apply.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
