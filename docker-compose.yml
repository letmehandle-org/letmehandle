# Local development only: PostgreSQL, a one-shot migration, and the backend.

# One image for the backend and its migration.
x-backend-build: &backend-build
  context: .
  dockerfile: infra/docker/backend.Dockerfile

services:
  postgres:
    image: postgres:17-alpine
    environment:
      # Local-only credentials, reachable from this network alone.
      POSTGRES_USER: letmehandle
      POSTGRES_PASSWORD: letmehandle
      POSTGRES_DB: letmehandle
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U letmehandle -d letmehandle"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Migrates to the latest schema and exits; the backend starts after it succeeds.
  migrate:
    build: *backend-build
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://letmehandle:letmehandle@postgres:5432/letmehandle
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: *backend-build
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-console}
      DATABASE_URL: postgresql+asyncpg://letmehandle:letmehandle@postgres:5432/letmehandle
      # No default keys; `make sample-env` writes fresh ones into .env.
      AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY:-}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      AUTH_REFRESH_TOKEN_TTL_SECONDS: ${AUTH_REFRESH_TOKEN_TTL_SECONDS:-7776000}
      OTP_PROVIDER: ${OTP_PROVIDER:-mock}
      OTP_PROVIDER_BY_CALLING_CODE: ${OTP_PROVIDER_BY_CALLING_CODE:-}
      OTP_ALLOWED_CALLING_CODES: ${OTP_ALLOWED_CALLING_CODES:-}
      OTP_CHALLENGES_PER_HOUR: ${OTP_CHALLENGES_PER_HOUR:-500}
      OTP_CHALLENGES_PER_HOUR_PER_CALLING_CODE: ${OTP_CHALLENGES_PER_HOUR_PER_CALLING_CODE:-100}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      SMS_ACCOUNT_ID: ${SMS_ACCOUNT_ID:-}
      SMS_AUTH_TOKEN: ${SMS_AUTH_TOKEN:-}
      SMS_FROM_NUMBER: ${SMS_FROM_NUMBER:-}
      SMS_VERIFY_SERVICE_ID: ${SMS_VERIFY_SERVICE_ID:-}
      TRANSCRIPT_ENCRYPTION_KEYS: ${TRANSCRIPT_ENCRYPTION_KEYS:-}
      SPEECH_PROVIDER: ${SPEECH_PROVIDER:-realtime}
      SPEECH_LANGUAGES: ${SPEECH_LANGUAGES:-en}
      SPEECH_ENDPOINT_URL: ${SPEECH_ENDPOINT_URL:-}
      SPEECH_MODEL: ${SPEECH_MODEL:-}
      SPEECH_AGENT_ID: ${SPEECH_AGENT_ID:-}
      SPEECH_TRANSCRIPTION_MODEL: ${SPEECH_TRANSCRIPTION_MODEL:-}
      SPEECH_API_KEY: ${SPEECH_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_HEADERS: ${LLM_HEADERS:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      # Example voices no service speaks; set SPEECH_VOICES and SPEECH_DEFAULT_VOICE in .env.
      SPEECH_VOICES: ${SPEECH_VOICES:-example-voice-a:Example voice A (not a real voice):en,example-voice-b:Example voice B (not a real voice):en}
      SPEECH_DEFAULT_VOICE: ${SPEECH_DEFAULT_VOICE:-example-voice-a}
      # Push notifications, each platform optional. Empty unless set in .env.
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_PRIVATE_KEY: ${APNS_PRIVATE_KEY:-}
      APNS_TOPIC: ${APNS_TOPIC:-}
      APNS_ENVIRONMENT: ${APNS_ENVIRONMENT:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      TELEPHONY_PROVIDER: ${TELEPHONY_PROVIDER:-}
      TELEPHONY_ACCOUNT_ID: ${TELEPHONY_ACCOUNT_ID:-}
      TELEPHONY_AUTH_TOKEN: ${TELEPHONY_AUTH_TOKEN:-}
      TELEPHONY_NUMBERS: ${TELEPHONY_NUMBERS:-}
      TELEPHONY_APP_ID: ${TELEPHONY_APP_ID:-}
      TELEPHONY_WEBHOOK_BASE_URL: ${TELEPHONY_WEBHOOK_BASE_URL:-}
      TELEPHONY_LINES: ${TELEPHONY_LINES:-}
      TELEPHONY_LINE_AUTH_TOKENS: ${TELEPHONY_LINE_AUTH_TOKENS:-}
      TELEPHONY_UNFORWARDED_CALLS_OWNER: ${TELEPHONY_UNFORWARDED_CALLS_OWNER:-}
      CALL_MAX_DURATION_SECONDS: ${CALL_MAX_DURATION_SECONDS:-14400}
      TRACING_OTLP_ENDPOINT: ${TRACING_OTLP_ENDPOINT:-}
      DIAGNOSTICS_TOKEN: ${DIAGNOSTICS_TOKEN:-}
    ports:
      # The host port, set with BACKEND_PORT.
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
