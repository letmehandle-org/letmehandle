# Local development only. There is no deployment target yet, and this file is not one.
#
# Two services, because two is what is needed. Anything added here that no code uses is a
# dependency contributors have to run for no reason.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      # Local only. These reach no network but this one, and the real deployment reads its
      # credentials from the environment rather than from a file in the repository.
      POSTGRES_USER: letmehandle
      POSTGRES_PASSWORD: letmehandle
      POSTGRES_DB: letmehandle
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U letmehandle -d letmehandle"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-console}
      DATABASE_URL: postgresql+asyncpg://letmehandle:letmehandle@postgres:5432/letmehandle
      SPEECH_PROVIDER: ${SPEECH_PROVIDER:-realtime}
      SPEECH_ENDPOINT_URL: ${SPEECH_ENDPOINT_URL:-}
      SPEECH_MODEL: ${SPEECH_MODEL:-}
      SPEECH_AGENT_ID: ${SPEECH_AGENT_ID:-}
      SPEECH_TRANSCRIPTION_MODEL: ${SPEECH_TRANSCRIPTION_MODEL:-}
      SPEECH_API_KEY: ${SPEECH_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_HEADERS: ${LLM_HEADERS:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      # Example voices, so the development stack starts. No speech service speaks them; set
      # SPEECH_VOICES and SPEECH_DEFAULT_VOICE in .env to your service's own.
      SPEECH_VOICES: ${SPEECH_VOICES:-example-voice-a:Example voice A (not a real voice):en,example-voice-b:Example voice B (not a real voice):en}
      SPEECH_DEFAULT_VOICE: ${SPEECH_DEFAULT_VOICE:-example-voice-a}
      TELEPHONY_PROVIDER: ${TELEPHONY_PROVIDER:-}
      TELEPHONY_ACCOUNT_ID: ${TELEPHONY_ACCOUNT_ID:-}
      TELEPHONY_AUTH_TOKEN: ${TELEPHONY_AUTH_TOKEN:-}
      TELEPHONY_NUMBERS: ${TELEPHONY_NUMBERS:-}
      TELEPHONY_APP_ID: ${TELEPHONY_APP_ID:-}
      TELEPHONY_WEBHOOK_BASE_URL: ${TELEPHONY_WEBHOOK_BASE_URL:-}
    ports:
      # Configurable, because 8000 is a popular port and a clash with something else on a
      # contributor's machine should not need a file to be edited.
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
