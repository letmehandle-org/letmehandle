apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
// Reads apps/mobile/.env into BuildConfig for react-native-config.
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

react {
    // Package locations resolved by settings.gradle, since pnpm installs at the repository root.
    root = file("../../")
    reactNativeDir = gradle.ext.reactNativeDir
    codegenDir = new File(gradle.ext.reactNativeDir.parentFile, "@react-native/codegen")
    cliFile = new File(gradle.ext.reactNativeDir, "cli.js")
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

// The JavaScriptCore flavour; the -intl variant adds ICU locale data.
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    // Fonts come from apps/mobile/assets, shared with iOS.
    sourceSets {
        main { assets.srcDirs += ['../../assets'] }
    }
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "org.letmehandle.app"
    defaultConfig {
        applicationId "org.letmehandle.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    testOptions {
        // Codec tests read the wire examples shared with the TypeScript tests.
        unitTests.all {
            systemProperty "wireExamples", file("../../src/calls/wire-examples.json").absolutePath
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Release builds are signed with the debug keystore.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

// Unit tests read the merged manifest, so dependency permissions are checked too.
androidComponents {
    onVariants(selector().all()) { variant ->
        def mergedManifest = variant.artifacts.get(com.android.build.api.artifact.SingleArtifact.MERGED_MANIFEST.INSTANCE)
        tasks.matching { it.name == "test${variant.name.capitalize()}UnitTest" }.configureEach { task ->
            task.inputs.file(mergedManifest).withPropertyName("mergedManifest")
            task.jvmArgumentProviders.add({ ["-DmergedManifest=${mergedManifest.get().asFile.absolutePath}"] } as CommandLineArgumentProvider)
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    testImplementation("junit:junit:4.13.2")
    // The real org.json, since the JVM test runtime only stubs Android's.
    testImplementation("org.json:json:20250517")

    androidTestImplementation("androidx.test:runner:1.7.0")
    androidTestImplementation("androidx.test.ext:junit:1.3.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
