// Resolves React Native packages through node, since pnpm installs them at the repository root; includeBuild takes a String.
pluginManagement {
    def resolvePackage = { String name, String from = null ->
        def paths = from == null ? "" : ", { paths: [${groovy.json.JsonOutput.toJson(from)}] }"
        def script = "require('path').dirname(require.resolve('${name}/package.json'${paths}))"
        def process = ["node", "--print", script].execute()
        def located = process.text.trim()
        process.waitFor()
        if (process.exitValue() != 0 || located.isEmpty()) {
            throw new GradleException(
                "Could not find ${name}. Run `pnpm install` from the repository root."
            )
        }
        return located
    }

    gradle.ext.reactNativeGradlePlugin = resolvePackage("@react-native/gradle-plugin")
    gradle.ext.reactNativeDir = new File(resolvePackage("react-native"))
    // React Native's own dependency, so found from it. Only a release build compiles JavaScript
    // ahead of time, which is why a debug build never missed it.
    gradle.ext.hermesCompilerDir = new File(resolvePackage("hermes-compiler", gradle.ext.reactNativeDir.path))

    includeBuild(gradle.ext.reactNativeGradlePlugin)
}

plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand()
}
rootProject.name = 'org.letmehandle.app'
include ':app'
includeBuild(gradle.ext.reactNativeGradlePlugin)
